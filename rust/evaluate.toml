# cargo-evaluate configuration for the Driftwatch workspace.
#
# `cargo evaluate` is part of the Driftwatch test harness (see AGENTS.md and
# docs/agentic-loop.md): the `just check` recipe and CI run it as a merge gate
# alongside test/clippy/fmt. Exceptions belong here with a justification, never
# silenced ad hoc.

[config]
# No globally disabled rules. Scope any genuinely-necessary exception as narrowly
# as possible — prefer an in-source `#[cfg_attr(false, allow(evaluate::<rule>))]`
# marker on the specific item over a workspace-wide entry here.
disabled = []
