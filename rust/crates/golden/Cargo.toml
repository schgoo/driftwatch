[package]
name = "golden"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Driftwatch golden trace corpus: reusable annotated fixture operations that back the byte-exact CTSC goldens."

[dependencies]
annotations.workspace = true
artifact.workspace = true

[dev-dependencies]
serde_json.workspace = true
contract.workspace = true
anyhow.workspace = true

[features]
# Off by default: a plain build expands the annotations to identity, so the
# fixture operations compile and emit nothing (and the goldens are skipped).
# Enabling `trace` turns on emission (macros expand into the runtime buffer).
# `driftwatch` additionally installs the live root-close emit sink — this is
# what drives the goldens through the real `trace.otlp.jsonl` file.
default = []
trace = ["annotations/trace"]
driftwatch = ["annotations/driftwatch"]
# Additive resolver-emit proof (Phase R). Turns on the annotations `resolve`
# capability so `tests/resolve_emit.rs` can drive the rust-analyzer-backed
# registry-emit path over a fixture crate. Implies `driftwatch` for the live
# emit sink.
resolve = ["driftwatch", "annotations/resolve"]

[lints]
workspace = true
