[package]
name = "annotations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Driftwatch annotation surface: the user-facing facade over the runtime and macros."

[dependencies]
runtime.workspace = true
annotations-macros.workspace = true
artifact = { workspace = true, optional = true }
extract = { workspace = true, optional = true }
contract = { workspace = true, optional = true }
resolver = { workspace = true, optional = true, features = ["ra"] }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
# Off by default so a plain build is zero-cost (macros expand to identity, no
# emission). The extraction driver enables `trace` to turn on emission.
default = []
trace = ["annotations-macros/trace"]
# The live auto-emit path: turns on `trace` emission and pulls in the artifact
# emitter glue that appends each root-close span tree to `trace.otlp.jsonl`,
# plus the `extract` derivation + `contract` model that write `registry.json`.
driftwatch = [
    "trace",
    "dep:artifact",
    "dep:extract",
    "dep:contract",
    "dep:serde_json",
]
# Additive, opt-in static-resolver emit path (Phase R). Builds on `driftwatch`
# and pulls in the rust-analyzer-backed `resolver` (its `ra` feature on). It is
# a *capability*, not a behavior switch: the resolver only produces the registry
# when a `[resolver] source` is configured in `driftwatch.toml`; with no source
# configured the emitter still uses the link-time `extract::derive` path, so the
# default behavior (and the Tier-1 golden) is unchanged even under this feature.
resolve = [
    "driftwatch",
    "dep:resolver",
    "resolver/ra",
]

[lints]
workspace = true
