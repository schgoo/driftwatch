[package]
name = "annotations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Driftwatch annotation surface: the user-facing facade over the runtime and macros."

[dependencies]
runtime.workspace = true
annotations-macros.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
# Off by default: a plain build is zero-cost, expanding every macro to identity
# so annotated code compiles unchanged and emits nothing (no registry statics,
# no `__rt` references). Enable `trace` — as the extraction driver does while
# taking a snapshot — to forward to the macro layer and turn on emission plus
# the link-time discovery registry.
default = []
trace = ["annotations-macros/trace"]

[lints]
workspace = true
