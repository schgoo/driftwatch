[package]
name = "annotations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Driftwatch annotation surface: the user-facing facade over the runtime and macros."

[dependencies]
runtime.workspace = true
annotations-macros.workspace = true
artifact = { workspace = true, optional = true }
contract = { workspace = true, optional = true }
resolver = { workspace = true, optional = true, features = ["ra"] }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
# Off by default so a plain build is zero-cost (macros expand to identity, no
# emission). The extraction driver enables `trace` to turn on emission.
default = []
trace = ["annotations-macros/trace"]
# The live auto-emit path: turns on `trace` emission and pulls in the artifact
# emitter glue that appends each root-close span tree to `trace.otlp.jsonl`,
# plus the rust-analyzer-backed `resolver` (its `ra` feature on) + `contract`
# model that resolve the target crate and write `registry.json`. The resolver is
# the default registry-emit path: it resolves the crate at the runtime
# `CARGO_MANIFEST_DIR` (a `[resolver] source` in `driftwatch.toml` overrides it).
driftwatch = [
    "trace",
    "dep:artifact",
    "dep:contract",
    "dep:resolver",
    "dep:serde_json",
    "resolver/ra",
]

[lints]
workspace = true
