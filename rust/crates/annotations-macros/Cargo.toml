[package]
name = "annotations-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Driftwatch procedural macros (operation/dep/watchable/point annotations)."

[lib]
proc-macro = true

[dependencies]
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true

[features]
# When enabled, the macros emit their full instrumentation (event emission and
# link-time registry entries). When disabled, every macro expands to identity,
# leaving zero emit/registry/`__rt` references in the output.
trace = []

[lints]
workspace = true
