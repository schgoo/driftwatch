[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/schgoo/driftwatch"
authors = ["Driftwatch contributors"]
publish = false

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Selected `restriction`-group lints that drive consistency and rigor.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
string_to_string = "warn"
too_long_first_doc_paragraph = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# Duplicate transitive dependency versions are pulled in by upstream crates and
# are not actionable from this workspace.
multiple_crate_versions = "allow"
# This is an unpublished workspace (`publish = false`), so per-crate registry
# metadata (readme/keywords/categories) is not required.
cargo_common_metadata = "allow"

[workspace.dependencies]
# Link-time distributed slices: the runtime's operation/type registry is
# populated across compilation units and iterated by discovery.
linkme = "0.3"
# Procedural-macro toolkit for the annotation macros.
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
# Internal crates wired together by the annotation facade.
runtime = { path = "crates/runtime" }
# The CTSC registry contract model the extraction driver derives into.
contract = { path = "crates/contract" }
# The extraction driver: derives a registry document from runtime discovery.
extract = { path = "crates/extract" }
annotations-macros = { path = "crates/annotations-macros" }
annotations = { path = "crates/annotations" }
artifact = { path = "crates/artifact" }
# The RA-backed static resolver (feature-gated); consumed downstream in R-d.
resolver = { path = "crates/resolver" }
# JSON assembly for the artifact emitter; also parses discovery output in tests.
serde_json = "1"
# Derive-based de/serialization for the CTSC registry contract model.
# Derive-based de/serialization: CTSC registry contract model + capture config.
serde = { version = "1", features = ["derive"] }
# TOML parser for the driftwatch.toml capture config.
toml = "0.8"
# Genuinely foreign error type for the resolver-oracle harness (dev-only): its
# opaque `anyhow::Error` cannot derive `Watchable`, so it exercises foreign
# error-channel recovery — see `crates/golden/tests/resolver_pending.rs`.
anyhow = "1"

# rust-analyzer as a library: the static resolver's real type-inference engine,
# behind the `resolver/ra` feature (default OFF) so the heavy/pinned RA deps stay
# out of the default workspace build. Pinned to =0.0.349: the next release
# (0.0.352) requires rustc 1.98, but this workspace is pinned to rustc 1.96.0
# (see `rust-version`). See docs/spikes/ra-extract/REPORT.md §8.
#
# Lock-only companion pin (do NOT add a direct dependency): `Cargo.lock` holds
# `salsa`/`salsa-macros`/`salsa-macro-rules` at 0.28.2. 0.28.4 changes the
# interned-struct/`intern` API and fails to compile `ra_ap 0.0.349`, so a
# `cargo update` that touches salsa must re-pin `--precise 0.28.2`.
ra_ap_hir = "=0.0.349"
ra_ap_ide = "=0.0.349"
ra_ap_ide_db = "=0.0.349"
ra_ap_load-cargo = "=0.0.349"
ra_ap_project_model = "=0.0.349"
ra_ap_syntax = "=0.0.349"
ra_ap_vfs = "=0.0.349"
# Pin `unicode-ident` to =1.0.22: without it, `ra-ap-rustc_lexer` panics at
# compile time on a Unicode-version mismatch between `unicode-ident` and
# `unicode-properties` (REPORT §8).
unicode-ident = "=1.0.22"
