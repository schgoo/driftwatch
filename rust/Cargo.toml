[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/schgoo/driftwatch"
authors = ["Driftwatch contributors"]
publish = false

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Selected `restriction`-group lints that drive consistency and rigor.
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
string_to_string = "warn"
too_long_first_doc_paragraph = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# Duplicate transitive dependency versions are pulled in by upstream crates and
# are not actionable from this workspace.
multiple_crate_versions = "allow"
# This is an unpublished workspace (`publish = false`), so per-crate registry
# metadata (readme/keywords/categories) is not required.
cargo_common_metadata = "allow"

# Shared dependencies are declared here; member crates opt in with
# `{crate}.workspace = true`. Serialization dependencies are intentionally
# absent until the artifact format is chosen (see the artifact-format issue) —
# the runtime defines only in-memory trace types.
[workspace.dependencies]
# Link-time distributed slices: the runtime's operation/type registry is
# populated across compilation units and iterated by discovery.
linkme = "0.3"
# Procedural-macro toolkit for the annotation macros.
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
# Internal crates wired together by the annotation facade.
runtime = { path = "crates/runtime" }
annotations-macros = { path = "crates/annotations-macros" }
