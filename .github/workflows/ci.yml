name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        working-directory: rust
        run: cargo build --workspace --all-targets
      - name: Tests
        working-directory: rust
        run: cargo test --workspace
      - name: Tests (all features)
        if: success() || failure()
        working-directory: rust
        run: cargo test --workspace --all-features
      - name: Clippy
        if: success() || failure()
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (all features)
        if: success() || failure()
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Format
        if: success() || failure()
        working-directory: rust
        run: cargo fmt -- --check
      # `cargo evaluate` is an internal tool that is not available on hosted CI
      # runners, so it runs as the local pre-PR gate (`just check` / `just
      # evaluate`) rather than in CI.
